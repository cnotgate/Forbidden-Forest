name: CI/CD Pipeline - Forbidden Forest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Check TypeScript & Build Frontend
        run: npm run build

  build-and-push:
    name: 🐳 Build & Push Docker Images to Docker Hub
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & Push Backend to Docker Hub
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/doctor-tracker-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/doctor-tracker-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Frontend to Docker Hub
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/doctor-tracker-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/doctor-tracker-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy to VPS via SSH (/srv/docker/forbidden-forest)
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e
            APP_DIR="/srv/docker/forbidden-forest"
            echo "🚀 Entering $APP_DIR..."
            cd "$APP_DIR"

            # Auto-detect compose file name
            if [ -f "docker-compose.prod.yml" ]; then
              COMPOSE_FILE="docker-compose.prod.yml"
            else
              COMPOSE_FILE="docker-compose.yml"
            fi
            echo "📦 Using Compose file: $COMPOSE_FILE"

            # Pull latest images from Docker Hub
            docker compose -f "$COMPOSE_FILE" pull

            # Run database migrations
            docker compose -f "$COMPOSE_FILE" run --rm backend npx prisma migrate deploy || true

            # Restart containers with zero downtime
            docker compose -f "$COMPOSE_FILE" up -d --remove-orphans

            # Clean old unused images to save disk space
            docker image prune -af --filter "until=24h"

            echo "✅ Forbidden Forest deployed successfully!"
