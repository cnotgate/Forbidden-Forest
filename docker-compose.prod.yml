# ========================================================
# DOCTOR TRACKER - PRODUCTION DOCKER COMPOSE (VIA DOCKER HUB)
# Khusus VPS yang sudah memiliki Nginx di sistem host.
# Port di-bind ke 127.0.0.1 (localhost) agar di-reverse proxy oleh Nginx host.
# Jalankan: docker compose -f docker-compose.prod.yml up -d
# ========================================================

services:
  db:
    image: postgres:16-alpine
    container_name: doctor_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-doctortracker}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-doctortracker}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - doc_network

  backend:
    image: ${DOCKERHUB_USER:-afati}/doctor-tracker-backend:latest
    container_name: doctor_tracker_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-doctortracker}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_jwt_access_secret_hogwarts_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_jwt_refresh_secret_hogwarts_2026}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - doc_network

  frontend:
    image: ${DOCKERHUB_USER:-afati}/doctor-tracker-frontend:latest
    container_name: doctor_tracker_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3080}:80"
    networks:
      - doc_network

volumes:
  postgres_data:
    driver: local

networks:
  doc_network:
    driver: bridge
